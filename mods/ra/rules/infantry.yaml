DOG:
  Inherits: ^Soldier
  Buildable:
    Queue: Infantry
    BuildAtProductionType: Dog
    BuildPaletteOrder: 50
    Prerequisites: [~kenn, ~techlevel.infonly]
  Description: actor-dog.description
  Valued:
    Cost: 200
  Tooltip:
    Name: actor-dog.name
    GenericName: actor-dog.generic-name
  UpdatesPlayerStatistics:
    AddToArmyValue: true
  Selectable:
    Bounds: [512, 725, -42, -170]
    DecorationBounds: [512, 725, -42, -170]
  Health:
    HP: 1800
  Mobile:
    Speed: 100
  Voice:
    Move:
      PauseOnCondition: "attack-cooldown || eating"
    Guard:
      Voice: Move
    Passenger:
      Voice: Move
  RevealsShroud:
    Range: 5c512
  Armament:
    Weapon: DogJaw
    ReloadingCondition: attack-cooldown
  AttackFrontal:
    AttackLeap:
      Voice: Attack
    PauseOnCondition: "attacking || attack-cooldown"
  AttackMove:
    Voice: Move
  GrantConditionOnAttack:
    Condition: eating
    RevokeDelay: 20
  GrantConditionWhileAiming:
    Condition: run
  AutoTarget:
    InitialStance: AttackAnything
    AutoTargetPriority@DEFAULT:
      ValidTargets: Infantry
  Targetable:
    TargetTypes: [GroundActor, Infantry]
  WithInfantryBody:
    MoveSequence: walk
    StandSequences: stand
    DefaultAttackSequence: eat
    RequiresCondition: "!run && !parachute"
  WithInfantryBody@RUN:
    MoveSequence: run
    RequiresCondition: "run && !parachute"
  WithInfantryBody@PARACHUTE:
    RequiresCondition: parachute
  Palette: player-noshadow
  IsPlayerPalette: true
  SpeedMultiplier:
    Modifier: 150
    RequiresCondition: run
  IgnoresDisguise: true
  Voiced:
    VoiceSet: DogVoice

