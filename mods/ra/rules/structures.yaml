############################################################
# 🧨 NEW BOMB TOWER (ADDED)
############################################################

BOMB:
	Inherits: ^Defense
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown

	Buildable:
		Queue: Defense
		BuildPaletteOrder: 85
		Prerequisites: weap, ~structures.soviet, ~techlevel.medium
		Description: Bomb Tower - launches explosive shells with area damage.

	Valued:
		Cost: 00

	Tooltip:
		Name: Bomb Tower

	Selectable:
		Bounds: 1024, 1024

	Health:
		HP: 45000

	Armor:
		Type: Heavy

	RevealsShroud:
		MinRange: 5c0
		Range: 7c0

	WithBuildingBib:
		HasMinibib: true

	Turreted:
		TurnSpeed: 40
		InitialFacing: 0
		RequiresCondition: !build-incomplete

	WithSpriteTurret:
		RequiresCondition: !build-incomplete

	Armament:
		Weapon: BombCannon
		LocalOffset: 0,0,900
		MuzzleSequence: muzzle

	AttackTurreted:
		PauseOnCondition: disabled || build-incomplete

	WithMuzzleOverlay:

	Power:
		Amount: -60

	DetectCloaked:
		Range: 6c0

	RenderRangeCircle:

############################################################
# 💥 Bomb Weapon (AOE DAMAGE)
############################################################

BombCannon:
	Range: 7c0
	ReloadDelay: 80
	Report: turret1.aud

	Projectile:
		Speed: 250
		Gravity: 200

	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 80
		ValidTargets: Ground, Water, Trees

	Warhead@2Eff: CreateEffect
		Explosion: big_bang