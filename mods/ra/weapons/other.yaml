^FireWeapon:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees, AirborneActor, Underwater
	ReloadDelay: 1
	Range: 999c0
	Report: firebl3.aud

	Projectile: InstantHit
		Blockable: false

	Warhead@1Dam: SpreadDamage
		Spread: 100c0
		Damage: 9999999
		ValidTargets: GroundActor, WaterActor, Trees, AirborneActor, Underwater
		Versus:
			None: 1000
			Wood: 1000
			Tree: 1000
			Light: 1000
			Heavy: 1000
			Concrete: 1000
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary, ExplosionDeath

	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		Size: 20
		InvalidTargets: Structure, Wall

	Warhead@3Eff: CreateEffect
		Explosions: nuke
		ImpactSounds: kaboom15.aud
		ImpactActors: false

	Warhead@4Shake: ShakeScreen
		Duration: 80
		Intensity: 20
		Multiplier: 5,5

	Warhead@5Flash: FlashEffect
		Duration: 60
		FlashType: Nuke


